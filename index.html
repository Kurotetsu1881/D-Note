try {

<style>
:root{
  --bg:#fff;--text:#1c1c1e;--muted:#74747a;--line:#e7e7ea;--tile:#f2f2f4;--chip:#e7e7eb;--chipt:#3b3b40;
  --green:#00a82d;--green-d:#008c25;--purple:#a45ae8;--acc:#4f5bd5;--accbg:#e8ebff;--pad:#fff1b8;--padline:#ecdc8c;
  --card:#fff;--side:#f7f7f8;--sel:#eef0ff;--red:#d93025;--shadow:0 6px 20px rgba(0,0,0,.14);
  --efont:"Inter",sans-serif;--esize:14px;--vh:100dvh;
}
[data-theme=dark]{--bg:#17181a;--text:#ececee;--muted:#9a9aa1;--line:#2b2c30;--tile:#232427;--chip:#2e2f34;--chipt:#d6d6da;--acc:#9aa4ff;--accbg:#2a2e5a;--pad:#4a4220;--padline:#6a5e2c;--card:#202124;--side:#111214;--sel:#232645;--shadow:0 6px 20px rgba(0,0,0,.5)}
[data-theme=sepia]{--bg:#f6eedb;--text:#43362a;--muted:#8a7a63;--line:#dccfb2;--tile:#ece1c6;--chip:#e6d9ba;--chipt:#5b4a33;--acc:#7a5a2a;--accbg:#e8dbb6;--pad:#f2e3a8;--padline:#d9c46c;--card:#fbf5e6;--side:#efe4cc;--sel:#e8dbb6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;font-size:13.5px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.ic{display:inline-flex;width:20px;height:20px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sp{flex:1}

/* ---------- Giriş / paylaşım görüntüleyici ---------- */
#lockscr{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}

#lockscr img{width:130px;margin-bottom:8px}
#lockMsg{font-weight:600;font-size:15px}
#lockscr input{width:100%;max-width:280px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;text-align:center;font-size:18px;letter-spacing:3px;outline:0}
#lockscr input:focus{border-color:var(--green)}
#lockscr .btn{width:100%;max-width:280px}
#lockErr{color:var(--red);font-size:12px;min-height:16px}
#lockForgot{color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline}
.sheet input[type=password]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;outline:0;font-size:13px;margin-bottom:8px}
#login{display:none;min-height:100%;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;background:#f7f7f5;color:#1c1c1e;position:fixed;inset:0;z-index:100}

#btnLogin{display:flex;align-items:center;gap:12px;background:#fff;color:#222;border:1px solid #dadce0;border-radius:22px;padding:11px 22px;font-size:13px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#btnLogin svg{width:20px;height:20px}
#loginErr{color:#d93025;min-height:18px}
#viewer{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:90}
.vtop{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.vtop img{width:26px;height:26px;border-radius:7px}

.vbody .vd{color:var(--muted);font-size:13px;margin-bottom:18px}
#vEditor.ql-container.ql-snow{border:0;font-family:var(--efont);font-size:var(--esize)}
#vEditor .ql-editor{padding:0;line-height:1.7}

/* ---------- Ana yerleşim ---------- */
#app{display:none;height:var(--vh);position:relative;background:var(--bg)}
#app.show{display:block}
#side{display:none}
#main{position:absolute;inset:0;overflow:hidden}
.scr{display:none;position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 16px calc(120px + env(safe-area-inset-bottom));background:var(--bg);-webkit-overflow-scrolling:touch;touch-action:pan-y}
@keyframes inL{from{transform:translateX(36px);opacity:.25}to{transform:none;opacity:1}}@keyframes inR{from{transform:translateX(-36px);opacity:.25}to{transform:none;opacity:1}}
.scr.slL{animation:inL .2s ease-out}.scr.slR{animation:inR .2s ease-out}
.scr.on{display:block}
.top{display:flex;align-items:center;gap:4px;padding:calc(12px + env(safe-area-inset-top)) 0 6px;min-height:62px}
.ttl{margin:0;font-size:17.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tbtn:hover{background:var(--tile)}
.tbtn.sm{width:32px;height:32px}
.avbtn{width:40px;height:40px;border-radius:50%;flex:none}
.av{width:40px;height:40px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.orb{width:34px;height:34px;border-radius:50%;background:#f5a000;color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-right:8px}

.homehead{text-align:center;margin:6px 0 16px}
.homehead h1{margin:0;font-size:21.5px;font-weight:700}
.hdate{color:var(--muted);margin-top:3px;font-size:12.5px}
.searchbox{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid #cfcfd6;border-radius:10px;padding:0 12px;height:34px;font-size:12px;color:var(--muted);background:var(--bg);margin-bottom:12px}
[data-theme=dark] .searchbox{border-color:#3a3b40}
.bigcards{display:grid;grid-template-columns:1.12fr 1fr;gap:12px;margin:22px 0 12px}
.bigcard{position:relative;height:104px;border-radius:13px;color:#fff;overflow:hidden;font-weight:600;font-size:13.5px;display:block}
.bigcard.green{background:var(--green)}
.bigcard.purple{background:var(--purple)}
.bc-t{position:absolute;left:12px;top:11px;display:flex;align-items:center;gap:6px}
.bc-t .ic{width:18px;height:18px}
.bc-ill{position:absolute;right:0;bottom:0;width:62%;height:78%}
.tiles{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:0 0 82px;height:86px;border-radius:14px;background:var(--tile);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-size:11.5px}
.sech{display:flex;align-items:center;justify-content:space-between;margin:24px 0 8px 4px}
.sech h2{margin:0;font-size:15.5px;font-weight:700}
.sech a{color:var(--acc);font-size:12px;font-weight:600;cursor:pointer}
.padbox{background:var(--pad);border:1px solid var(--padline);border-radius:12px;height:140px}
.padbox textarea{width:100%;height:100%;border:0;outline:0;resize:none;background:transparent;padding:14px 16px;font-size:13.5px;line-height:1.5;color:#2c2a22}
[data-theme=dark] .padbox textarea{color:#f1ead0}
.padbox textarea::placeholder{color:#6b684f}
.count{margin:2px -16px 0;padding:11px 16px;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5d5d63}
.lst{margin:0 -16px}
.nwrap{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.nwrap .nrow{position:relative;z-index:1;background:var(--bg);border-bottom:0;touch-action:pan-y;transition:transform .22s ease;will-change:transform;-webkit-user-select:none;user-select:none}
.nwrap .nrow:active,.nwrap .nrow.cur{background:var(--sel)}
.nwrap.drag .nrow{transition:none}
.nact{position:absolute;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 12px;visibility:hidden}
.nwrap.reveal .nact{visibility:visible}
.nact button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font:inherit;font-size:9.5px;cursor:pointer;width:52px;padding:0}
.nact button .cir{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.nact button .ic{width:17px;height:17px}
.nact .c-more .cir{background:#8e8e93}.nact .c-dl .cir{background:#2f7df6}.nact .c-del .cir{background:#e5484d}.nact .c-ok .cir{background:#00a82d}

.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;padding:9px 14px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.nrow:active,.nrow.cur{background:var(--sel)}
.nmain{min-width:0}
.nt{font-size:13px;font-weight:600;line-height:1.25;display:flex;gap:6px;align-items:center}
.nt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt .ic{width:12px;height:12px;color:var(--green);flex:none}
.ns{color:var(--muted);font-size:11px;margin-top:2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ns mark,.sres mark{background:#ffe27a;color:#222;border-radius:3px;padding:0 1px}
.nth{width:50px;height:50px;border-radius:8px;object-fit:cover;grid-row:1/3;grid-column:2;align-self:start}
.nm{grid-column:1/3;margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:10px}
.chip{background:var(--chip);color:var(--chipt);border-radius:6px;padding:1px 7px;font-size:10px;display:inline-flex;align-items:center;gap:4px;max-width:100%}
.chip .ic{width:12px;height:12px}
.chip.pill{border-radius:20px;font-size:12px;padding:6px 13px}
.chip.rem{background:#fff0d6;color:#8a5a00}
[data-theme=dark] .chip.rem{background:#4a3a14;color:#ffd98a}
.nrow.dense .ns,.nrow.dense .nth{display:none}
.nrow.dense .nm{margin-top:3px}
.lrow{display:flex;align-items:center;gap:12px;padding:13px 16px;margin:0 -16px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow .lt{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lc{color:var(--muted);font-size:13.5px}
.lrow .ic{color:#444}
[data-theme=dark] .lrow .ic{color:#ccc}
.empty{padding:48px 24px;font-size:12.5px;text-align:center;color:var(--muted);line-height:1.6}
.empty .ic{width:38px;height:38px;opacity:.5;margin-bottom:8px}
:root{--homebg:#f3f3f5}[data-theme=dark]{--homebg:#0f1011}[data-theme=sepia]{--homebg:#ece1c8}
#scr-home{background:var(--bg)}
.htop{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;min-height:40px;padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:6px}
.hside{display:flex;align-items:center}.hside.r{justify-content:flex-end}
.htop .homehead{margin:0;display:flex;flex-direction:column;align-items:center;justify-items:center;text-align:center;width:100%}.hlogo{height:40px;width:auto;display:block;margin:0 auto}[data-theme=dark] .hlogo{background:#f3f3f5;border-radius:12px;padding:3px 10px}.hdate{font-size:11px;color:var(--muted);margin-top:6px}
.cards{margin:0 0 4px}
.nbcard{position:relative;display:flex;align-items:center;gap:12px;padding:8px 6px 8px 14px;background:var(--bg);border-bottom:1px solid var(--line);cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.nbcard:active{background:var(--sel)}
.nbcard:active{background:var(--sel)}
.nbimg{width:var(--hthumb,34px);height:var(--hthumb,34px);flex:none;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--accbg);color:var(--acc)}
.nbimg img{width:100%;height:100%;object-fit:cover;display:block}
.nbimg .ic{width:calc(var(--hthumb,34px)*.5);height:calc(var(--hthumb,34px)*.5)}
.nbname{flex:1;min-width:0;font-family:var(--hfont,inherit);font-size:var(--hnb,13px);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:5px}.nbname .ic{width:12px;height:12px;color:var(--green);flex:none}
.nbcnt{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:11px}.nbcnt .ic{width:12px;height:12px}
.nbmore,.nrmore{flex:none}
.nrmore{position:absolute;right:2px;top:50%;transform:translateY(-50%);z-index:2}
.nwrap .nrow{padding-right:38px}
.nrow .nt{font-family:var(--htfont,inherit);font-size:var(--hsize,13px)}
.nrow .ns{font-family:var(--hsfont,inherit);font-size:var(--hsnip,11px)}
.nm:empty{display:none}
.sorting{position:relative;z-index:30;box-shadow:0 10px 28px rgba(0,0,0,.28);transition:none!important;opacity:.97;transform-origin:center}
.sort-active{touch-action:none}
.nbprev{width:150px;height:150px;border-radius:26px;margin:6px auto 12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--accbg);color:var(--acc)}
.nbprev img{width:100%;height:100%;object-fit:cover}.nbprev .ic{width:60px;height:60px}
.nbmodes{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.nbmodes label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.nbopt{display:flex;justify-content:center;gap:10px;margin-bottom:10px;min-height:36px;align-items:center}
.setprev{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:4px 0 8px;background:var(--bg)}
.setprev .pt{font-family:var(--tfont,var(--efont));font-size:var(--tsize);font-weight:var(--tweight);line-height:1.25;margin-bottom:6px}
.setprev .pb{font-family:var(--efont);font-size:var(--esize);font-weight:var(--eweight);line-height:var(--elh)}
.sw{width:30px;height:30px;border-radius:50%;border:0;flex:none}
.nbopt input[type=color]{width:34px;height:34px;padding:0;border:0;background:none}
.lrow .nbi{width:28px;height:28px;border-radius:8px;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center}
.lrow .nbi .ic{width:16px;height:16px}
.fpick{display:flex;align-items:center;justify-content:space-between;text-align:left}
.sel{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:0 10px;font-size:14px}
.rng{width:100%;accent-color:var(--green)}
.setl{font-size:12px;color:var(--muted);margin:10px 0 4px}
.ttl.mt{margin-left:4px}
#editor .ql-editor li.ql-indent-1:not(.ql-direction-rtl){padding-left:3em}#editor .ql-editor li.ql-indent-2:not(.ql-direction-rtl){padding-left:4.5em}#editor .ql-editor li.ql-indent-3:not(.ql-direction-rtl){padding-left:6em}#editor .ql-editor li.ql-indent-4:not(.ql-direction-rtl){padding-left:7.5em}
.stp{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 8px 2px}
.stp .sv{display:flex;align-items:center;gap:6px}
.stp button{width:34px;height:34px;border-radius:50%;background:var(--tile);font-size:18px;line-height:1;color:var(--text)}
.stp b{min-width:54px;text-align:center;font-size:14px}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:19}

/* ---------- Görevler / takvim ---------- */
.addrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 14px;margin:4px 0 10px}
.addrow input{flex:1;border:0;outline:0;background:none;height:40px;min-width:0;font-size:13px}
.trow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.trow .tc{color:var(--purple)}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.trow .tt{flex:1;min-width:0;font-size:13.5px;word-break:break-word;cursor:pointer}
.due{font-size:10.5px;color:var(--muted);display:block;margin-top:2px}
.due.late{color:var(--red);font-weight:600}
.subh{margin:18px 0 4px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5d5d63}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.calhead b{font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dw{font-size:10.5px;color:var(--muted);padding:6px 0}
.cal button{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px}
.cal button.dim{opacity:.35}
.cal button.today{border:1.5px solid var(--green)}
.cal button.sel{background:var(--acc);color:#fff}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--green)}
.dots i.t{background:var(--purple)}.dots i.r{background:#f5a000}
.cal button.sel .dots i{background:#fff}

/* ---------- Ayarlar / şablonlar ---------- */
.setg{margin:20px 0 6px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5d5d63}
.seg{display:flex;background:var(--tile);border-radius:12px;padding:4px;gap:4px;margin:8px 0}

/* ---------- Otomatik kaydetme ---------- */
function scheduleSave() { if (!curId || loadedId !== curId) return; updateStatus("Yazılıyor…"); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 700); }
function flushSave() { if (saveTimer) saveNow(); }
let warned = false;

  clearTimeout(saveTimer); saveTimer = null;
  if (!uid || !curId || loadedId !== curId) return;
  const n = getNote(curId); if (!n || n.trashed) return;
  const content = cleanHTML();
  if (content.length > 950000) { if (!warned) { warned = true; toast("Bu not 1 MB sınırına ulaştı (Firestore sınırı). Kaydedilmedi; bazı görselleri silin."); } setSaveErr("Bu not 1 MB sınırına ulaştı: son değişiklikler KAYDEDİLMİYOR. Bazı görselleri silin ya da notu bölün."); updateStatus("Not çok büyük – kaydedilmedi"); return; }
  warned = false; if (saveErr) setSaveErr(null);
  const data = { title: $("eTitle").value, content, plain: (quill.getText().trim() + " " + [...quill.root.querySelectorAll(".dn-table td")].map(c => c.textContent).join(" ")).trim(), updatedAt: Date.now() };
  { // çakışma koruması + sürüm geçmişi (kaydetmeden ÖNCE)
    const rs = remoteSeen.get(n.id), bs = baseMap.get(n.id);
    if (rs && bs && rs.t > bs.t && rs.content && rs.content !== bs.content && rs.content !== content) { verWrite(n.id, { title: rs.title, content: rs.content }, "Başka cihazdaki sürüm"); toast("Bu not başka bir cihazda da değişmişti. O sürüm 'Sürüm geçmişi'ne kaydedildi.", 6500); }
    else if (n.content && n.content !== content && Date.now() - (verLast.get(n.id) || 0) > 600000) verWrite(n.id, { title: n.title, content: n.content }, "");
    baseMap.set(n.id, { t: data.updatedAt, content });
  }
  Object.assign(n, data);
  setDoc(noteRef(curId), data, { merge: true }).catch(e => { console.warn(e); setSaveErr("Kaydedilemedi: " + (e.code || e.message || e) + ". Notun kopyasını alın."); });
  if (n.shareId) { const sid = n.shareId; inlineHTML(900000).then(c => setDoc(doc(db, "shared", sid), { ownerUid: uid, noteId: n.id, title: data.title, content: c, updatedAt: data.updatedAt }, { merge: true })).catch(() => {}); }
}

const inlineCache = new Map();

    if (e.dataset.img === "1") {

document.addEventListener("click", e => {
  const nv = e.target.closest("[data-nav]");

/* ---------- Notlarda sola kaydırma eylemleri ---------- */
let swOpen = null;
function swClose(except) { document.querySelectorAll(".nwrap.reveal").forEach(w => { if (w === except) return; const r = w.querySelector(".nrow"); r.style.transform = ""; w.classList.remove("reveal"); }); swOpen = except || null; }
(() => {
  let st = null, justSwiped = false;
  const down = e => {
    if (e.pointerType === "mouse") return;
    const w = e.target.closest(".nwrap"); if (!w || e.target.closest(".nact")) return;
    const row = w.querySelector(".nrow"), W = +w.dataset.w, was = w.classList.contains("reveal");
    st = { w, row, W, x: e.clientX, y: e.clientY, base: was ? -W : 0, dx: 0, mode: "", id: e.pointerId };
  };
  const move = e => {
    if (!st || e.pointerId !== st.id) return;
    if (window.__sorting) { st = null; return; }
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.mode) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { st.mode = "h"; swClose(st.w); st.w.classList.add("reveal", "drag"); }
      else if (Math.abs(dy) > 8) { st = null; return; }
      else return;
    }
    st.dx = dx; const t = Math.max(-st.W, Math.min(0, st.base + dx)); st.row.style.transform = `translateX(${t}px)`;
  };
  const up = e => {
    if (!st || e.pointerId !== st.id) return;
    const s = st; st = null;
    if (s.mode !== "h") return;
    justSwiped = true; setTimeout(() => justSwiped = false, 350);
    s.w.classList.remove("drag");
    const cur = Math.max(-s.W, Math.min(0, s.base + s.dx));
    if (cur < -s.W / 2) { s.row.style.transform = `translateX(${-s.W}px)`; swOpen = s.w; }
    else { s.row.style.transform = ""; s.w.classList.remove("reveal"); swOpen = null; }
  };
  document.addEventListener("pointerdown", down, true);
  document.addEventListener("pointermove", move, true);
  document.addEventListener("pointerup", up, true);
  document.addEventListener("pointercancel", up, true);
  // kaydırma sonrası ya da açık satıra dokunulunca not açılmasın; satır kapansın
  document.addEventListener("click", e => {
    const sw = e.target.closest("[data-sw]");
    if (sw) { e.stopPropagation(); return swAction(sw.dataset.sw, sw.dataset.id, sw); }
    const row = e.target.closest(".nwrap .nrow");
    if (row && (justSwiped || row.closest(".nwrap").classList.contains("reveal"))) { e.stopPropagation(); e.preventDefault(); if (!justSwiped) swClose(); return; }
    if (swOpen && !e.target.closest(".nwrap")) swClose();
  }, true);
})();
function swDownload(n) {
  if (lockedNow(n)) return askPassword(() => swDownload(n), "Kilitli not");
  const d = document.createElement("div"); d.innerHTML = n.content || "";
  download(fileSafe(n.title) + ".html", "text/html", `<!doctype html><html lang="tr"><meta charset="utf-8"><title>${esc(n.title)}</title><body style="font-family:sans-serif;max-width:760px;margin:30px auto"><h1>${esc(n.title)}</h1>${d.innerHTML}</body></html>`);
  toast("Not indirildi.");
}
const fmtFull = t => t ? new Date(t).toLocaleString("tr-TR", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
const plainOf = n => (n.plain != null ? n.plain : (() => { const d = document.createElement("div"); d.innerHTML = n.content || ""; return d.textContent; })()) || "";
function noteStats(n) {
  const c = n.content || "", p = plainOf(n).trim(), words = p ? p.split(/\s+/).length : 0;
  let files = 0, fsize = 0, imgs = 0; for (const m of c.matchAll(/<div[^>]*data-mid="[^"]*"[^>]*>/g)) { files++; const z = m[0].match(/data-size="(\d+)"/); fsize += z ? +z[1] : 0; if (/data-mime="image/.test(m[0])) imgs++; }
  return { words, chars: p.length, text: new Blob([c]).size, files, imgs, fsize };
}
function detailSheet(title, rows) {
  openSheet(`${shHead(title)}${rows.map(([k, v]) => `<div class="arow" style="cursor:default"><span class="st" style="color:var(--muted)">${k}</span><span style="text-align:right;max-width:60%;word-break:break-word">${v}</span></div>`).join("")}`);
  $("sheet").onclick = e => { if (e.target.closest("[data-act=closeSheet]")) closeAll(); };
}
function noteDetail(id) {
  const n = getNote(id); if (!n) return;
  if (lockedNow(n)) return askPassword(() => noteDetail(id), "Kilitli not");
  const t = noteStats(n), nb = nbKey(n);
  detailSheet("Not detayı", [
    ["Başlık", esc(n.title) || "Başlıksız"], ["Oluşturulma", fmtFull(n.createdAt)], ["Son değişiklik", fmtFull(n.updatedAt)],
    ["Not defteri", nb ? esc((notebooks.find(b => b.id === nb) || {}).name) : esc(generalName)],
    ["Kelime sayısı", t.words], ["Karakter sayısı", t.chars], ["Metin boyutu", fmtBytes(t.text)],
    ["Resim", t.imgs], ["Ekli dosya", t.files - t.imgs], ["Eklerin boyutu", fmtBytes(t.fsize)],
    ["Etiketler", (n.tags || []).length ? n.tags.map(esc).join(", ") : "—"], ["Hatırlatıcı", n.reminder ? fmtFull(n.reminder) : "—"],
    ["Kilit", n.locked ? "Kilitli" : "Yok"], ["Paylaşım", n.shareId ? "Bağlantı var" : "Yok"]]);
}
function nbDetail(id) {
  const b = notebooks.find(x => x.id === id); if (!b) return;
  if (b.locked && sec.hash && !isUnlocked()) return askPassword(() => nbDetail(id), "Kilitli not defteri");
  const ns = live().filter(n => nbKey(n) === id); let words = 0, size = 0, files = 0, fsize = 0;
  ns.forEach(n => { const t = noteStats(n); words += t.words; size += t.text; files += t.files; fsize += t.fsize; });
  const last = Math.max(0, ...ns.map(n => n.updatedAt || 0));
  detailSheet("Not defteri detayı", [
    ["Ad", esc(b.name)], ["Oluşturulma", fmtFull(b.createdAt)], ["Son değişiklik", last ? fmtFull(last) : "—"],
    ["Not sayısı", ns.length], ["Toplam kelime", words], ["Metin boyutu", fmtBytes(size)],
    ["Ek / resim sayısı", files], ["Eklerin boyutu", fmtBytes(fsize)], ["Kilit", b.locked ? "Kilitli" : "Yok"], ["Kısayol", b.shortcut ? "Evet" : "Hayır"]]);
}
function moveInNotebook(id, d) {
  const nb = nbKey(getNote(id)), l = listNotes({ nb }), i = l.findIndex(n => n.id === id), j = i + d; if (i < 0 || j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]]; const b = writeBatch(db); l.forEach((n, k) => { n.nbOrd = k; b.update(noteRef(n.id), { nbOrd: k }); }); b.commit().catch(e => console.warn(e)); schedule();
}
function noteMoreMenu(id, el) {
  const n = getNote(id); if (!n) return;
  const inNb = route.p === "notes" && route.a && route.a.nb !== undefined && !n.trashed, lst = inNb ? listNotes({ nb: route.a.nb }) : [], pos = lst.findIndex(x => x.id === id);
  showMenu([
    { i: "notes", t: "Notu aç", f: () => openNote(id) },
    { i: "info", t: "Not detayı", f: () => noteDetail(id) },
    ...(inNb && pos > 0 ? [{ i: "chevu", t: "Yukarı taşı", f: () => moveInNotebook(id, -1) }] : []), ...(inNb && pos >= 0 && pos < lst.length - 1 ? [{ i: "chevd", t: "Aşağı taşı", f: () => moveInNotebook(id, 1) }] : []),
    { i: "lock", t: n.locked ? "Kilidi kaldır" : "Kilitle", f: () => toggleLock(n, v => patchNote(id, { locked: v })) },
    { i: "pin", t: n.pinned ? "Not defterinden sabitlemeyi kaldır" : "Not defterine sabitle", f: () => { patchNote(id, { pinned: !n.pinned }); toast(n.pinned ? "Not sabitlendi." : "Sabitleme kaldırıldı."); schedule(); } },
    { i: "pin", t: n.homePinned ? "Giriş sayfasından kaldır" : "Giriş sayfasına sabitle", f: () => { patchNote(id, { homePinned: !n.homePinned }); toast(n.homePinned ? "Giriş sayfasına sabitlendi." : "Giriş sayfasından kaldırıldı."); schedule(); } },
    { i: n.shortcut ? "star" : "starplus", t: n.shortcut ? "Kısayollardan kaldır" : "Kısayollara ekle", f: () => { patchNote(id, { shortcut: !n.shortcut }); toast(n.shortcut ? "Kısayollara eklendi." : "Kısayollardan kaldırıldı."); schedule(); } }
  ], { anchor: el, right: true });
}
function swAction(k, id, el) {
  const n = getNote(id); if (!n) return;
  if (k === "del") { swClose(); patchNote(id, { trashed: true, updatedAt: Date.now() }); toast("Not çöp kutusuna taşındı."); return schedule(); }
  if (k === "restore") { swClose(); patchNote(id, { trashed: false, updatedAt: Date.now() }); toast("Not geri yüklendi."); return schedule(); }
  if (k === "purge") { swClose(); if (confirm("Bu not kalıcı olarak silinsin mi?")) { purgeMedia(n.content); deleteDoc(noteRef(id)); } return; }
  if (k === "dl") { swClose(); return swDownload(n); }
  if (k === "more") {
    noteMoreMenu(id, el);
    swClose();
  }
}

async function openViewer(id) {
  $("viewer").hidden = false; $("login").classList.remove("show"); hideSplash();
  try {
    const s = await getDoc(doc(db, "shared", id)); if (!s.exists()) throw new Error("yok");
    const d = s.data(); document.title = (d.title || "Not") + " – D-Note";
    $("vTitle").textContent = d.title || "Başlıksız"; $("vDate").textContent = fmtDate(d.updatedAt);
    const vq = new Quill("#vEditor", { theme: "snow", readOnly: true, modules: { toolbar: false } });
    vq.setContents(vq.clipboard.convert(d.content || ""), "silent");
  } catch (e) { $("vErr").hidden = false; }
}
